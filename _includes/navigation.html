<div class="navbar-wrapper">
    <nav class="navbar navbar-default navbar-fixed-top" role="navigation">
        <div class="container">
            <div class="navbar-header">
                <button type="button" class="navbar-toggle collapsed"
                        data-toggle="collapse" data-target="#navbar"
                        aria-expanded="false" aria-controls="navbar">
                    <span class="sr-only">Toggle navigation</span>
                    <span class="icon-bar"></span>
                    <span class="icon-bar"></span>
                    <span class="icon-bar"></span>
                </button>
                <a class="navbar-brand" href="{{ '/' | relative_url }}#page-top">{{ site.title }}</a>
            </div>
            <div id="navbar" class="navbar-collapse collapse">
                <ul class="nav navbar-nav navbar-right" id="i18_navbar">
                    {% for section in site.data.landing %}
                    {% if section.tpl %}
                    <li>
                        <a class="page-scroll"
                           href="{% if page.url != '/' %}{{ '/' | relative_url }}{% endif %}#{{ section.id }}">
                            {{ section.name }}
                        </a>
                    </li>
                    {% else %}
                    <li>
                        <a href="{{ '/section.id/' | prepend: project.baseurl }}">
                            {{ section.name }}
                        </a>
                    </li>
                    {% endif %}
                    {% endfor %}
                    
                </ul>
            </div>
        </div>
    </nav>
</div>
